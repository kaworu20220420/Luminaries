<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8" />

	<!-- 外部CSS -->
	<link rel="stylesheet" href="style.css" />
</head>

<body>
	<div id="全体コンテナ">

		<!-- 左右中央寄せのヘッダーコンテナ -->
		<div id="ヘッダーコンテナ">

			<!-- 左側：タイトル・作者・訳者・表紙 -->
			<div id="左情報コンテナ">
				<div id="タイトルコンテナ">
					<a href="https://www.amazon.co.jp/ルミナリーズ-エレノア・キャトン/dp/4000256025">
						THE LUNINARIES<br />ルミナリーズ
					</a>
				</div>

				<div id="作者コンテナ">
					Eleanor Catton<br />エレノア・キャトン
				</div>

				<div id="訳者コンテナ">
					安達まみ
				</div>

				<div id="表紙コンテナ">
					<a href="https://www.amazon.co.jp/ルミナリーズ-エレノア・キャトン/dp/4000256025">
						<img src="Cover.jpg" alt="表紙" width="300">
					</a>
				</div>
			</div>

			<!-- 右側：目次（章選択） -->
			<div id="目次コンテナ">
				<div id="章選択コンテナ">
					<label class="章ラベル"><input type="radio" name="章選択" value="1" checked />第1部 天球の中の天球</label>
					<label class="章ラベル"><input type="radio" name="章選択" value="2" />第2部 兆し</label>
					<label class="章ラベル"><input type="radio" name="章選択" value="3" />第3部 自己破壊の家</label>

					<label class="章ラベル"><input type="radio" name="章選択" value="4" />第4部 パエンガ＝ファ＝ファ</label>
					<label class="章ラベル"><input type="radio" name="章選択" value="5" />第5部 重量と金銭</label>
					<label class="章ラベル"><input type="radio" name="章選択" value="6" />第6部 やもめとドレス</label>

					<label class="章ラベル"><input type="radio" name="章選択" value="7" />第7部 住み処ドミサイル</label>
					<label class="章ラベル"><input type="radio" name="章選択" value="8" />第8部 オーロラ近郊の真実</label>
					<label class="章ラベル"><input type="radio" name="章選択" value="9" />第9部 柔軟な地球ミュータブル・アース</label>

					<label class="章ラベル"><input type="radio" name="章選択" value="10" />第10部 相続の問題</label>
					<label class="章ラベル"><input type="radio" name="章選択" value="11" />第11部 オリオン座が沈み蠍座が昇る</label>
					<label class="章ラベル"><input type="radio" name="章選択" value="12" />第12部 老いた月が若き月の腕に抱かれて</label>
				</div>
			</div>

		</div>

		<!-- 円図SVG -->
		<svg id="円図"></svg>

		<!-- 情報テーブル -->
		<div id="情報テーブルコンテナ"></div>

	</div>

	<!-- app.js 読み込み -->
	<script src="app.js"></script>

	<!-- namespace LuminariesApplication 呼び出し元 -->
	<script>
		document.addEventListener("DOMContentLoaded", () => {
			try {
				if (typeof LuminariesApplication == "undefined") {
					console.error("LuminariesApplication が未定義です");
					return;
				}

				LuminariesApplication.起動管理.初期化する();

				const ラジオ一覧 = document.querySelectorAll("input[name='章選択']");
				ラジオ一覧.forEach(ラジオ => {
					ラジオ.addEventListener("change", () => {
						if (ラジオ.checked) {
							LuminariesApplication.起動管理.章変更する(ラジオ.value);
						}
					});
				});

			} catch (例外) {
				console.error("index.html 初期化例外: ", 例外);
			}
		});
	</script>
</body>
</html>
