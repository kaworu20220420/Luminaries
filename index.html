<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8" />

	<!-- namespace LuminariesApplication の style -->
	<style>
		/* <summary>画面全体のレイアウトを整える</summary> */
		body {
			margin: 0;
			padding: 0;
			font-family: "Yu Gothic", sans-serif;
			background-color: #f5f5f5;
		}

		#全体コンテナ {
			width: 100%;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding-top: 20px;
		}

		#円図 {
			width: 600px;
			height: 600px;
			background-color: white;
			border: 1px solid #ccc;
		}

		text {
			font-size: 16px;
			text-anchor: middle;
			dominant-baseline: middle;
			cursor: pointer;
		}
	</style>
</head>

<body>
	<div id="全体コンテナ">

		<!-- <summary>円図SVGのコンテナ</summary> -->
		<svg id="円図"></svg>

	</div>

	<!-- app.js 読み込み -->
	<script src="app.js"></script>

	<!-- namespace LuminariesApplication 呼び出し元 -->
	<script>
        // <summary>初期化処理を呼び出す</summary>
        document.addEventListener("DOMContentLoaded", () => {
            try {
                if (typeof LuminariesApplication == "undefined") {
                    console.error("LuminariesApplication が未定義です");
                    return;
                }

                LuminariesApplication.起動管理.初期化する();

            } catch (例外) {
                console.error("index.html 初期化例外: ", 例外);
            }
        });
	</script>
</body>
</html>
