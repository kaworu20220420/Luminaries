<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8" />

	<style>
		/* <summary>背景に paper.png を敷く</summary> */
		body {
			margin: 0;
			padding: 0;
			font-family: "Yu Gothic", sans-serif;
			background-image: url("paper.png");
			background-size: cover;
			background-repeat: no-repeat;
			background-attachment: fixed;
		}

		#全体コンテナ {
			width: 100%;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding-top: 20px;
		}

		/* <summary>章選択ラジオボタン（3×3 グリッド）</summary> */
		#章選択コンテナ {
			margin-bottom: 20px;
			background-color: rgba(255,255,255,0.7);
			padding: 10px 20px;
			border-radius: 8px;
			display: grid;
			grid-template-columns: repeat(3, auto);
			gap: 10px 20px;
		}

		.章ラベル {
			display: flex;
			align-items: center;
			gap: 4px;
			font-size: 18px;
		}

		/* <summary>円図SVG（透明）</summary> */
		#円図 {
			width: 700px;
			height: 700px;
			background-color: transparent;
			border: none;
		}

		/* <summary>恒星・惑星・地球のフォント拡大用 class（6倍）</summary> */
		.恒星記号 {
			font-size: 96px;
		}

		.惑星記号 {
			font-size: 96px;
		}

		.地球記号 {
			font-size: 96px;
		}

		text {
			text-anchor: middle;
			dominant-baseline: middle;
			cursor: pointer;
		}

		/* <summary>ムーディーな線の色</summary> */
		.円周線 {
			stroke: #444;
			stroke-width: 2;
			opacity: 0.3;
			fill: none;
		}

		.パイ線 {
			stroke: #666;
			stroke-width: 1;
			opacity: 0.3;
			fill: none;
		}

		/* <summary>情報テーブルコンテナ（スマホ用クリック表示）</summary> */
		#情報テーブルコンテナ {
			width: 90%;
			margin-top: 30px;
			padding: 20px;
			background-image: url("34-024.png");
			background-size: cover;
			background-repeat: no-repeat;
			border-radius: 12px;
			min-height: 200px;
		}

		#情報テーブル {
			width: 80%; /* ← 80% に変更 */
			background-color: transparent; /* ← 完全透明に変更 */
			border-collapse: collapse;
			font-size: 18px;
		}

			#情報テーブル td {
				border-bottom: 1px solid #ccc;
				padding: 8px;
			}
	</style>
</head>

<body>
	<div id="全体コンテナ">
		<div id="タイトルコンテナ"><a href="https://www.amazon.co.jp/ルミナリーズ-エレノア・キャトン/dp/4000256025?__mk_ja_JP=カタカナ&crid=1EW73ZIPG2SOW&dib=eyJ2IjoiMSJ9.HcKn8vAw1VWA2ZyZ16mxG6Kw1ZFQsaB6t1sEz_2kR5DGjHj071QN20LucGBJIEps.qvtCY8QPh_1p8vbb1-lPuOGic3RS1BwEVkLp43RaDsk&dib_tag=se&keywords=ルミナリーズ&qid=1789262118&sprefix=ルミナリーズ%2Caps%2C184&sr=8-1&linkCode=sl2&tag=futurelife004-22&linkId=06693015aec48331c2bb7eeed877885f&ref_=as_li_ss_tl&ascsubtag=srctok-67dd40fd75e0926e&btn_type=ss&btn_ref=srctok-67dd40fd75e0926e"> THE LUNINARIES<br />ルミナリーズ</a></div>
		<div id="作者コンテナ">Eleanor Catton<br />エレノア・キャトン</div>
		<div id="訳者コンテナ">安達まみ</div>
		<div id="表紙コンテナ"><a href="https://www.amazon.co.jp/ルミナリーズ-エレノア・キャトン/dp/4000256025?__mk_ja_JP=カタカナ&crid=1EW73ZIPG2SOW&dib=eyJ2IjoiMSJ9.HcKn8vAw1VWA2ZyZ16mxG6Kw1ZFQsaB6t1sEz_2kR5DGjHj071QN20LucGBJIEps.qvtCY8QPh_1p8vbb1-lPuOGic3RS1BwEVkLp43RaDsk&dib_tag=se&keywords=ルミナリーズ&qid=1789262118&sprefix=ルミナリーズ%2Caps%2C184&sr=8-1&linkCode=sl2&tag=futurelife004-22&linkId=06693015aec48331c2bb7eeed877885f&ref_=as_li_ss_tl&ascsubtag=srctok-67dd40fd75e0926e&btn_type=ss&btn_ref=srctok-67dd40fd75e0926e"><img src="Cover.avif" alt="表紙"></a></div>

		<!-- 章選択ラジオボタン -->
		<div id="章選択コンテナ">
			<label class="章ラベル"><input type="radio" name="章選択" value="1" checked />第1部 天球の中の天球</label>
			<label class="章ラベル"><input type="radio" name="章選択" value="2" />第2部 兆し</label>
			<label class="章ラベル"><input type="radio" name="章選択" value="3" />第3部 自己破壊の家</label>

			<label class="章ラベル"><input type="radio" name="章選択" value="4" />第4部 パエンガ＝ファ＝ファ</label>
			<label class="章ラベル"><input type="radio" name="章選択" value="5" />第5部 重量と金銭</label>
			<label class="章ラベル"><input type="radio" name="章選択" value="6" />第6部 やもめとドレス</label>

			<label class="章ラベル"><input type="radio" name="章選択" value="7" />第7部 住み処ドミサイル</label>
			<label class="章ラベル"><input type="radio" name="章選択" value="8" />第8部 オーロラ近郊の真実</label>
			<label class="章ラベル"><input type="radio" name="章選択" value="9" />第9部 柔軟な地球ミュータブル・アース</label>

			<label class="章ラベル"><input type="radio" name="章選択" value="10" />第10部 相続の問題</label>
			<label class="章ラベル"><input type="radio" name="章選択" value="11" />第11部 オリオン座が沈み蠍座が昇る</label>
			<label class="章ラベル"><input type="radio" name="章選択" value="12" />第12部 老いた月が若き月の腕に抱かれて</label>
		</div>

		<!-- 円図SVG -->
		<svg id="円図"></svg>

		<!-- 情報テーブル（スマホ用クリック表示） -->
		<div id="情報テーブルコンテナ"></div>

	</div>

	<!-- app.js 読み込み -->
	<script src="app.js"></script>

	<!-- namespace LuminariesApplication 呼び出し元 -->
	<script>
		document.addEventListener("DOMContentLoaded", () => {
			try {
				if (typeof LuminariesApplication == "undefined") {
					console.error("LuminariesApplication が未定義です");
					return;
				}

				LuminariesApplication.起動管理.初期化する();

				const ラジオ一覧 = document.querySelectorAll("input[name='章選択']");
				ラジオ一覧.forEach(ラジオ => {
					ラジオ.addEventListener("change", () => {
						if (ラジオ.checked) {
							LuminariesApplication.起動管理.章変更する(ラジオ.value);
						}
					});
				});

			} catch (例外) {
				console.error("index.html 初期化例外: ", 例外);
			}
		});
	</script>
</body>
</html>
